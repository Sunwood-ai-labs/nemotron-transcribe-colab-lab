name: Notebook and source quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install notebook validator
        run: python -m pip install nbformat
      - name: Check notebook, evidence, and public payload
        run: python tools/check_repository.py
      - name: Verify notebook link regression cases
        run: python -m unittest discover -s tests -v
      - name: Verify the saved Colab execution proof
        run: python tools/verify_execution.py
